name: CI

on:
  push:
  pull_request:
  schedule:
    - cron: "6 20 * * 6"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  code-style:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.3"
          bundler-cache: true
      - run: bundle exec rake rubocop

  test:
    name: test (${{ matrix.ruby }}, ${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
        ruby:
          - "2.7.0"
          - "2.7"
          - "3.0.0"
          - "3.0"
          - "3.1.0"
          - "3.1"
          - "3.2.0"
          - "3.2"
          - "3.3.0"
          - "3.3"
          - "3.4.0"
          - "3.4"
          - "4.0.0"
          - "4.0"
          - ruby-head
          - jruby-9.4
          - jruby-10.0
          - truffleruby
        include:
          - os: macos-latest
            ruby: "4.0"
          - os: windows-latest
            ruby: "4.0"
    steps:
      - uses: actions/checkout@v6
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: ${{ matrix.ruby }}
          bundler-cache: true
      - run: bundle exec rake spec
